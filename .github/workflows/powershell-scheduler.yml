name: Push Powershell-Scheduler Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docker-containers/powershell-scheduler/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Powershell-Scheduler
        uses: docker/build-push-action@v6
        with:
          context: ./docker-containers/powershell-scheduler
          push: true
          tags: ccridge/powershell-scheduler:latest
