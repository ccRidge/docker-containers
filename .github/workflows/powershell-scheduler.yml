name: Push Powershell-Scheduler Container

on:
  push:
    branches: [ "master" ]
    paths:
      - 'powershell-scheduler/**'
  workflow_dispatch: # Enables the manual "Run workflow" button in the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Powershell-Scheduler
        uses: docker/build-push-action@v7
        with:
          context: ./powershell-scheduler
          push: true
          tags: ccridge/powershell-scheduler:latest
